appId: com.embroiderdesign.app
productName: Embroider Design
copyright: Copyright (c) 2026 Embroider Design contributors
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
# The bundled typefaces. These are read from disk by path at runtime, so they
# have to sit beside the app rather than inside the asar archive — a font
# inside asar has no real filesystem path for the font scanner to stat.
# Without this block the app installs and runs, but every cursive face is
# missing and lettering falls back to whatever the machine happens to have.
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  # Deliberately not ${productName}: that interpolates the space in "Embroider
  # Design", and electron-builder writes the *sanitized* name (spaces to
  # hyphens) into latest.yml. The two then disagree, and GitHub renames a
  # hand-attached asset again — to dots — so the updater 404s looking for a file
  # that exists under a third name. Hard-coding a space-free name makes the file
  # on disk, the entry in latest.yml and the uploaded asset identical.
  artifactName: Embroider-Design-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Per-user, so an update can be applied without an admin prompt. A
  # per-machine install would make every silent update require elevation.
  perMachine: false
# Where the app looks for updates. electron-builder writes this into
# `app-update.yml` inside the installer, which is the file `electron-updater`
# reads at runtime — so a build without this block simply cannot self-update.
publish:
  - provider: github
    owner: atlas-navigate
    repo: embroider-design
    releaseType: release
